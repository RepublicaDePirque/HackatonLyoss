<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brújula USM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Brújula USM</title>
<style>
  :root { --bg:#0e1116; --fg:#e8edf3; --mut:#8a94a3; --acc:#ffd23f; --line:#2a313c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { font:17px/1.4 -apple-system,system-ui,sans-serif; -webkit-user-select:none; user-select:none; -webkit-text-size-adjust:100%; }
  main { min-height:100dvh; display:flex; flex-direction:column; gap:10px; max-width:520px; margin-inline:auto;
         padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px); }
  select, button { font:inherit; font-size:18px; padding:14px 16px; border-radius:14px; border:1px solid var(--line); background:#171c24; color:var(--fg); width:100%; min-height:52px; }
  select { appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%); background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%; background-size:6px 6px; background-repeat:no-repeat; }
  button.big { background:var(--acc); color:#000; border-color:var(--acc); font-weight:700; }
  button.on { background:var(--acc); color:#000; border-color:var(--acc); }
  canvas { width:100%; display:block; border-radius:10px; background:#12161d; border:1px solid var(--line); }
  #dial { width:min(86vw, 46dvh); aspect-ratio:1; margin:6px auto 0; background:#000; border-radius:50%; border:none; }
  #info { text-align:center; }
  #dir { font-size:40px; font-weight:800; color:var(--acc); line-height:1.1; }
  #dist { font-size:24px; margin-top:4px; }
  .mut { color:var(--mut); font-size:14px; }
  #sub { margin-top:4px; }
  label { display:block; margin:10px 0 4px; }
  input[type=range] { width:100%; }
  #warn { color:#ff8a8a; font-size:15px; min-height:20px; text-align:center; }
  #hint { text-align:center; margin-top:auto; }
  #simBox, #hint.dbg { display:none; }
  .debug #simBox { display:block; }
</style>
</head>
<body>
<main>
<select id="dest" aria-label="Destino"></select>

<canvas id="dial"></canvas>
<div id="info">
  <div id="dir">—</div>
  <div id="dist">—</div>
  <div class="mut" id="sub"></div>
</div>
<div id="warn"></div>
<button id="modeBtn" class="big">Activar ubicación y brújula</button>

<div id="simBox">
  <div class="mut">Debug (sin GPS): toca el mapa para mover tu posición (azul = GPS crudo, verde = ajustada al camino, aro amarillo = siguiente nodo) y gira el celular con el deslizador.</div>
  <canvas id="map" style="aspect-ratio:7/4;margin-top:8px;cursor:crosshair"></canvas>
  <label>Posición simulada</label>
  <select id="from" style="width:100%"></select>
  <label>Rumbo del celular: <b id="hv">0</b>°</label>
  <input id="head" type="range" min="0" max="359" value="0">
</div>
<div id="hint" class="mut">Mantén la pantalla encendida. Si la flecha se ve rara, mueve el teléfono en forma de 8 para calibrar la brújula.</div>
</main>

<script>
// ---------- Geometría ----------
const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
const norm360 = a => ((a % 360) + 360) % 360;
const norm180 = a => { a = norm360(a); return a > 180 ? a - 360 : a; };

function bearing(a, b) {
  const dLon = toRad(b.lng - a.lng);
  const y = Math.sin(dLon) * Math.cos(toRad(b.lat));
  const x = Math.cos(toRad(a.lat)) * Math.sin(toRad(b.lat)) -
            Math.sin(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.cos(dLon);
  return norm360(toDeg(Math.atan2(y, x)));
}
function distance(a, b) {
  const R = 6371000, dLat = toRad(b.lat - a.lat), dLon = toRad(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const DIRS = ["Norte","Noreste","Este","Sureste","Sur","Suroeste","Oeste","Noroeste"];
const cardinal = deg => DIRS[Math.round(deg / 45) % 8];

// ---------- Grafo de ejemplo ----------
// ⚠ COORDENADAS DE EJEMPLO: origen aproximado (Casa Central USM, Valparaíso) y
// nodos en metros respecto a él. Reemplazar por los nodos reales del plano.
const ORIGIN = { lat: -33.0346, lng: -71.5965 };
const fromXY = (x, y) => ({
  lat: ORIGIN.lat + y / 111320,
  lng: ORIGIN.lng + x / (111320 * Math.cos(toRad(ORIGIN.lat)))
});
const N = (id, name, x, y) => ({ id, name, x, y, ...fromXY(x, y), edges: [] });
const nodesList = [
  N("entrada","Entrada",        0,   0),
  N("n2","",                    0,  80),
  N("biblio","Biblioteca",      0, 160),
  N("n4","",                  100, 160),
  N("casino","Casino",        200, 160),
  N("n6","",                  200,  80),
  N("gym","Gimnasio",         200,   0),
  N("n8","",                  100,   0),
  N("labs","Laboratorios",    -80,  80),
];
// Edificio en el centro (100,80): no hay arista que lo cruce, la ruta lo rodea.
const edgePairs = [
  ["entrada","n2"],["n2","biblio"],["biblio","n4"],["n4","casino"],
  ["casino","n6"],["n6","gym"],["gym","n8"],["n8","entrada"],["labs","n2"],
];
const graph = Object.fromEntries(nodesList.map(n => [n.id, n]));
edgePairs.forEach(([a, b]) => { graph[a].edges.push(b); graph[b].edges.push(a); });
const DESTS = nodesList.filter(n => n.name);

// ---------- A* ----------
function astar(graph, start, goal) {
  const h = id => distance(graph[id], graph[goal]);
  const open = new Set([start]), came = {}, g = { [start]: 0 }, f = { [start]: h(start) };
  while (open.size) {
    let cur = null;
    for (const id of open) if (cur === null || f[id] < f[cur]) cur = id;
    if (cur === goal) {
      const path = [cur];
      while (came[cur]) { cur = came[cur]; path.unshift(cur); }
      return path;
    }
    open.delete(cur);
    for (const n of graph[cur].edges) {
      const t = g[cur] + distance(graph[cur], graph[n]);
      if (t < (g[n] ?? Infinity)) { came[n] = cur; g[n] = t; f[n] = t + h(n); open.add(n); }
    }
  }
  return null;
}
function nearest(graph, p) {
  let best = null, bd = Infinity;
  for (const id in graph) { const d = distance(p, graph[id]); if (d < bd) { bd = d; best = id; } }
  return best;
}
const pathLen = path => { let s = 0; for (let i = 0; i < path.length - 1; i++) s += distance(graph[path[i]], graph[path[i + 1]]); return s; };

// ---------- Ajuste al grafo (map matching) + avance de nodos ----------
const SNAP_MAX = 40;   // m: más lejos que esto del camino, se usa la posición cruda
const ARRIVE_R = 15;   // m: radio para dar un nodo por alcanzado
const HYST = 15;       // m: ventaja mínima para cambiar de nodo objetivo

const toXY = p => ({ x: (p.lng - ORIGIN.lng) * 111320 * Math.cos(toRad(ORIGIN.lat)), y: (p.lat - ORIGIN.lat) * 111320 });

// Proyecta la posición sobre la arista más cercana del grafo.
function snapToGraph(p) {
  const q = toXY(p); let best = null;
  for (const [a, b] of edgePairs) {
    const A = graph[a], B = graph[b], dx = B.x - A.x, dy = B.y - A.y, L2 = dx * dx + dy * dy;
    const t = L2 ? Math.max(0, Math.min(1, ((q.x - A.x) * dx + (q.y - A.y) * dy) / L2)) : 0;
    const x = A.x + t * dx, y = A.y + t * dy, d = Math.hypot(q.x - x, q.y - y);
    if (!best || d < best.d) best = { a, b, x, y, d, ...fromXY(x, y) };
  }
  return best;
}

// Devuelve el siguiente nodo de la ruta, la posición ajustada y la distancia restante.
function guide() {
  const dest = state.destId, snap = snapToGraph(state.user);
  const onGraph = snap.d <= SNAP_MAX;
  const pos = onGraph ? snap : state.user;
  const cands = onGraph ? [snap.a, snap.b] : [nearest(graph, state.user)];
  const costs = {}; let best = null;
  for (const id of cands) {
    const path = astar(graph, id, dest); if (!path) continue;
    costs[id] = distance(pos, graph[id]) + pathLen(path);
    if (!best || costs[id] < best.c) best = { id, c: costs[id] };
  }
  if (!best) return null;
  let target = best.id;
  if (state.target in costs && costs[state.target] <= best.c + HYST) target = state.target; // histéresis
  while (target !== dest && distance(pos, graph[target]) < ARRIVE_R) target = astar(graph, target, dest)[1]; // avance
  state.target = target;
  return { snap, onGraph, pos, target, remaining: distance(pos, graph[target]) + pathLen(astar(graph, target, dest)) };
}

// ---------- Estado ----------
const DEBUG = new URLSearchParams(location.search).has("debug");   // ?debug muestra mapa y simulador
document.documentElement.classList.toggle("debug", DEBUG);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

const state = {
  active: false, fix: false,
  mode: "sim",                       // "sim" | "gps"
  user: fromXY(0, 0),
  heading: 0,                        // rumbo suavizado
  destId: DESTS[0].id,
};

// ---------- UI ----------
const $ = id => document.getElementById(id);
$("dest").innerHTML = DESTS.map(d => `<option value="${d.id}">${d.name}</option>`).join("");
$("dest").onchange = e => { state.destId = e.target.value; state.target = null; render(); };
$("from").innerHTML = nodesList.map(n => `<option value="${n.id}">${n.name || "Cruce " + n.id}</option>`).join("");
$("from").onchange = e => { state.user = { lat: graph[e.target.value].lat, lng: graph[e.target.value].lng }; render(); };
$("head").oninput = e => { setHeading(+e.target.value); $("hv").textContent = e.target.value; };

// Rumbo suavizado con promedio circular (evita el salto 359° -> 0°)
let hx = 1, hy = 0;
function setHeading(deg) {
  const k = state.mode === "sim" ? 1 : 0.2;
  hx += k * (Math.cos(toRad(deg)) - hx);
  hy += k * (Math.sin(toRad(deg)) - hy);
  state.heading = norm360(toDeg(Math.atan2(hy, hx)));
  render();
}

// ---------- Modo GPS ----------
let watchId = null;
async function enableGps() {
  $("warn").textContent = "";
  if (!navigator.geolocation) { $("warn").textContent = "Este navegador no tiene geolocalización."; return false; }
  try {
    // iOS: debe llamarse directo desde el toque del usuario, antes de cualquier otro await
    if (typeof DeviceOrientationEvent !== "undefined" && DeviceOrientationEvent.requestPermission) {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r !== "granted") throw new Error("Brújula denegada. Cierra Safari por completo y vuelve a abrir la página para permitirla.");
    }
  } catch (e) { $("warn").textContent = e.message; return false; }
  const onOri = e => {
    let h = e.webkitCompassHeading;                                  // iOS
    if (h == null && e.absolute && e.alpha != null) h = 360 - e.alpha; // Android
    if (h != null) setHeading(h);
  };
  window.addEventListener("deviceorientationabsolute", onOri, true);
  window.addEventListener("deviceorientation", onOri, true);
  watchId = navigator.geolocation.watchPosition(
    p => { state.fix = true; $("warn").textContent = ""; state.user = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }; render(); },
    err => { $("warn").textContent = err.code === 1 ? "Ubicación denegada. Actívala en Ajustes > Privacidad > Localización > Safari." : "GPS: " + err.message; },
    { enableHighAccuracy: true, maximumAge: 1000 }
  );
  return true;
}
if (DEBUG) { $("modeBtn").textContent = "Modo: simulado"; $("modeBtn").classList.remove("big"); }
$("modeBtn").onclick = async () => {
  if (state.mode === "sim") {
    if (!(await enableGps())) return;
    state.mode = "gps"; state.active = true; state.fix = false;
    if (DEBUG) { $("modeBtn").textContent = "Modo: GPS real"; $("modeBtn").classList.add("on"); }
    else $("modeBtn").style.display = "none";
  } else {
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    state.mode = "sim"; $("modeBtn").textContent = "Modo: simulado"; $("modeBtn").classList.remove("on");
  }
  render();
};

// ---------- Render ----------
function fit(c) {
  const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (c.width !== Math.round(r.width * dpr)) { c.width = r.width * dpr; c.height = r.height * dpr; }
  const ctx = c.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: r.width, h: r.height };
}

function drawDial(bDest, arrived) {
  const { ctx, w, h } = fit($("dial"));
  const cx = w / 2, cy = h / 2, R = w / 2 - 6;
  ctx.clearRect(0, 0, w, h);
  const pt = (deg, r) => [cx + r * Math.sin(toRad(deg)), cy - r * Math.cos(toRad(deg))];

  // dial: rota con el rumbo (el rumbo actual queda arriba)
  for (let a = 0; a < 360; a += 5) {
    const th = a - state.heading, major = a % 30 === 0;
    ctx.strokeStyle = a === 0 ? "#ff453a" : (major ? "#fff" : "#6b6b70");
    ctx.lineWidth = major ? 2.5 : 1.5;
    const [x1, y1] = pt(th, R), [x2, y2] = pt(th, R - (major ? 16 : 9));
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  const labels = { 0:"N", 90:"E", 180:"S", 270:"O" };
  for (let a = 0; a < 360; a += 30) {
    const th = a - state.heading, txt = labels[a] ?? String(a);
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(toRad(th));
    ctx.fillStyle = a === 0 ? "#ff453a" : "#fff";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = labels[a] ? "600 26px system-ui" : "500 14px system-ui";
    ctx.fillText(txt, 0, -(R - (labels[a] ? 44 : 38)));
    ctx.restore();
  }

  // marcador del destino sobre el aro
  if (!arrived && bDest != null) {
    const th = bDest - state.heading, [x, y] = pt(th, R - 14);
    ctx.fillStyle = "#ffd60a"; ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fill();
    ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.stroke();
  }

  // indicador fijo arriba (triángulo blanco)
  ctx.fillStyle = "#fff"; ctx.beginPath();
  ctx.moveTo(cx, cy - R - 2); ctx.lineTo(cx - 8, cy - R - 16); ctx.lineTo(cx + 8, cy - R - 16); ctx.closePath(); ctx.fill();

  // centro: grados y punto cardinal
  ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "600 44px system-ui"; ctx.fillText(Math.round(state.heading) + "°", cx, cy - 8);
  ctx.font = "500 18px system-ui"; ctx.fillStyle = arrived ? "#ffd60a" : "#8e8e93";
  ctx.fillText(arrived ? "destino" : cardinal(state.heading), cx, cy + 28);
}

const label = id => graph[id].name || "cruce";

function drawMap(g) {
  const { ctx, w, h } = fit($("map"));
  ctx.clearRect(0, 0, w, h);
  const pad = 36, minX = -80, maxX = 200, minY = 0, maxY = 160;
  const s = Math.min((w - 2 * pad) / (maxX - minX), (h - 2 * pad) / (maxY - minY));
  const ox = (w - s * (maxX - minX)) / 2, oy = (h + s * (maxY - minY)) / 2;
  mapT = { s, ox, oy, minX, minY };
  const P = (x, y) => [ox + (x - minX) * s, oy - (y - minY) * s];
  ctx.strokeStyle = "#3a4452"; ctx.lineWidth = 3;
  for (const [a, b] of edgePairs) { const [x1, y1] = P(graph[a].x, graph[a].y), [x2, y2] = P(graph[b].x, graph[b].y); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
  ctx.font = "11px system-ui"; ctx.textAlign = "center";
  for (const n of nodesList) {
    const [x, y] = P(n.x, n.y);
    ctx.fillStyle = n.id === state.destId ? "#ffd23f" : "#8a94a3";
    ctx.beginPath(); ctx.arc(x, y, n.name ? 5 : 3, 0, 7); ctx.fill();
    if (n.name) ctx.fillText(n.name, x, y - 9);
  }
  if (g) {
    const [tx, ty] = P(graph[g.target].x, graph[g.target].y);
    ctx.strokeStyle = "#ffd23f"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(tx, ty, 10, 0, 7); ctx.stroke();
    const u = toXY(state.user), [ux, uy] = P(u.x, u.y), [sx, sy] = P(g.snap.x, g.snap.y);
    ctx.strokeStyle = "#6aa9ff"; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(ux, uy); ctx.lineTo(sx, sy); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "#4cd964"; ctx.beginPath(); ctx.arc(sx, sy, 4, 0, 7); ctx.fill();   // ajustado
    ctx.fillStyle = "#6aa9ff"; ctx.beginPath(); ctx.arc(ux, uy, 5, 0, 7); ctx.fill();   // GPS crudo
  }
}
let mapT = null;

function render() {
  const waiting = (!DEBUG && !state.active) ? "Toca «Activar» para empezar"
                : (state.mode === "gps" && !state.fix) ? "Buscando señal GPS…" : null;
  if (waiting) {
    $("dir").textContent = "—"; $("dist").textContent = waiting; $("sub").textContent = "";
    drawDial(null, false); if (DEBUG) drawMap(null);
    return;
  }
  const dest = graph[state.destId];
  const straight = distance(state.user, dest);
  const arrived = straight < 20;
  let b = bearing(state.user, dest), g = null;
  if (arrived) {
    state.target = null;
    $("dir").textContent = "Estás llegando";
    $("dist").textContent = dest.name;
    $("sub").textContent = "";
  } else if ((g = guide())) {
    b = bearing(g.pos, graph[g.target]);
    $("dir").textContent = cardinal(b);
    $("dist").textContent = `~${Math.round(g.remaining / 10) * 10} m · ${Math.max(1, Math.round(g.remaining / 80))} min`;
    $("sub").textContent = `Siguiente: ${label(g.target)} (${Math.round(distance(g.pos, graph[g.target]))} m)` +
      (g.onGraph ? "" : " · lejos del camino") + (state.user.acc ? ` · GPS ±${Math.round(state.user.acc)} m` : "");
  } else {
    $("dir").textContent = cardinal(b); $("dist").textContent = "Sin ruta"; $("sub").textContent = "Destino no conectado al grafo";
  }
  drawDial(b, arrived);
  if (DEBUG) drawMap(g);
}
$("map").onclick = e => {
  if (state.mode !== "sim" || !mapT) return;
  const r = e.target.getBoundingClientRect(), { s, ox, oy, minX, minY } = mapT;
  state.user = fromXY((e.clientX - r.left - ox) / s + minX, (oy - (e.clientY - r.top)) / s + minY);
  render();
};
window.addEventListener("resize", render);
render();
</script>
</body>
</html>
