<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Modo mapa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Chakra+Petch:wght@500;700&display=swap">
<style>
body{margin:0}
a{text-decoration:none}a:hover{opacity:0.9}
@keyframes respira{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 390px; height: 844px; background: {{bg}}; color: {{fg}}; font-family: 'Instrument Sans', system-ui, sans-serif">
<img src="/_blob/82d8df1cdcdbbd75057b2340df46bedc" alt="Plano de Casa Central con los edificios identificados por letra" style="position: absolute; left: -370px; top: 80px; width: 900px; max-width: none; filter: {{skin}}; mix-blend-mode: {{blend}}; opacity: {{mapOp}}">
<div aria-hidden="true" style="position: absolute; left: 75px; top: 268px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, #B79CFF 0%, transparent 66%); filter: blur(14px); opacity: 0.75; animation: respira 6s ease-in-out infinite"></div>
<div style="position: absolute; left: 111px; top: 326px; height: 44px; padding: 0 14px; border-radius: 22px; background: {{fg}}; color: {{bg}}; display: flex; align-items: center; gap: 8px; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 15px">Edificio C</div>
<div aria-hidden="true" style="position: absolute; left: 174px; top: 470px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, #FFB877 0%, transparent 66%); filter: blur(10px); opacity: 0.9; animation: respira 3.500s ease-in-out infinite"></div>
<div role="img" aria-label="Tu posición" style="position: absolute; left: 222px; top: 518px; width: 24px; height: 24px; box-sizing: border-box; border-radius: 12px; background: #FFB877; border: 4px solid {{fg}}"></div>
<div style="position: absolute; left: 20px; top: 24px; display: flex; align-items: center; gap: 10px">
<a href="Main.dc.html" aria-label="Volver a la brújula" style="width: 44px; height: 44px; border-radius: 22px; background: {{surface}}; backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); border: 1px solid {{line}}; box-sizing: border-box; color: {{fg}}; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="height: 44px; padding: 0 16px; border-radius: 22px; background: {{surface}}; backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); border: 1px solid {{line}}; box-sizing: border-box; display: flex; align-items: center; gap: 8px">
<span style="font-size: 13px; color: {{muted}}">Vas hacia</span>
<span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 17px">Edificio C</span>
</div>
</div>
<div style="position: absolute; left: 20px; top: 636px; width: 350px; box-sizing: border-box; padding: 18px; border-radius: 26px; background: {{surface}}; backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); border: 1px solid {{line}}; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 16px 40px rgba(12, 10, 24, 0.2)">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
<span style="font-size: 16px; font-weight: 600">Estás aquí</span>
<span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 22px">180 m</span>
</div>
<span style="font-size: 14px; line-height: 1.4; color: {{muted}}">El mapa te ubica. El camino lo eliges tú.</span>
<div role="group" aria-label="Tipo de señal" style="display: flex; gap: 4px; padding: 4px; border-radius: 26px; background: {{pista}}">
<a href="Main.dc.html" style="flex: 1 1 0; height: 44px; border-radius: 22px; color: {{fg}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Luz</a>
<a href="Main.dc.html" style="flex: 1 1 0; height: 44px; border-radius: 22px; color: {{fg}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Flecha</a>
<span aria-current="true" style="flex: 1 1 0; height: 44px; border-radius: 22px; background: {{fg}}; color: {{bg}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Mapa</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","default":"oscuro","options":["oscuro","claro"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var claro = (this.props.tema ?? 'oscuro') === 'claro';
return {
bg: claro ? '#F6F1EA' : '#15131F',
fg: claro ? '#1D1A26' : '#F5F1EA',
muted: claro ? '#5E5869' : '#B3ADBF',
surface: claro ? 'rgba(255,255,255,0.78)' : 'rgba(40,36,56,0.78)',
line: claro ? 'rgba(29,26,38,0.07)' : 'rgba(255,255,255,0.09)',
pista: claro ? 'rgba(29,26,38,0.06)' : 'rgba(255,255,255,0.07)',
skin: claro ? 'sepia(0.35) hue-rotate(205deg) saturate(0.9) contrast(0.9)' : 'invert(1) sepia(0.4) hue-rotate(200deg) saturate(1.2) brightness(0.8)',
blend: claro ? 'multiply' : 'screen',
mapOp: claro ? '0.85' : '0.8'
};
}
}
</script>
</body>
</html>
