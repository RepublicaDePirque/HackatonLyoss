<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Llegada y foto para la comunidad</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Chakra+Petch:wght@500;700&display=swap">
<style>
body{margin:0}
a{text-decoration:none}a:hover{opacity:0.9}
@keyframes respira{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 48px 20px 28px; background: {{bg}}; color: {{fg}}; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
<div aria-hidden="true" style="position: absolute; left: -155px; top: -260px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, #FF5C39 0%, #FFB800 42%, transparent 68%); filter: blur(40px); opacity: {{gop}}; animation: respira 7s ease-in-out infinite"></div>
<div style="position: relative; display: flex; flex-direction: column; gap: 12px">
<span style="width: 56px; height: 56px; border-radius: 28px; background: {{fg}}; color: {{bg}}; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
<h1 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 38px; line-height: 1.1">Llegaste al Edificio C</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5">Encontraste el camino por tu cuenta. Así se ve según quienes llegaron antes que tú.</p>
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: {{muted}}">Fotos de la comunidad</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="height: 130px; border-radius: 20px; background: {{surface}}; backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); border: 1px dashed {{dash}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; font-size: 13px; color: {{muted}}">[FOTO DE LA ENTRADA]</div>
<div style="height: 130px; border-radius: 20px; background: {{surface}}; backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); border: 1px dashed {{dash}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; font-size: 13px; color: {{muted}}">[FOTO DEL PASILLO]</div>
</div>
</div>
<div style="position: relative; flex-grow: 1; border-radius: 24px; background: {{surface}}; backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); border: 1px solid {{line}}; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 10px; justify-content: center">
<span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 20px">Ayuda al siguiente</span>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: {{muted}}">Toma una foto de lo que ves ahora. Quien busque este lugar después podrá reconocerlo al llegar.</p>
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 8px">
<button type="button" style="height: 56px; border: 0; border-radius: 18px; background: #FF5C39; color: #1D1A26; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 18px; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"></rect><circle cx="12" cy="13" r="3.5"></circle><path d="M9 6l1.5-2h3L15 6"></path></svg>
Tomar foto
</button>
<a href="Buscar.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500; color: {{muted}}">Ahora no</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","default":"claro","options":["oscuro","claro"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var claro = (this.props.tema ?? 'claro') === 'claro';
return {
bg: claro ? '#F6F1EA' : '#15131F',
fg: claro ? '#1D1A26' : '#F5F1EA',
muted: claro ? '#5E5869' : '#B3ADBF',
surface: claro ? 'rgba(255,255,255,0.68)' : 'rgba(40,36,56,0.62)',
line: claro ? 'rgba(29,26,38,0.07)' : 'rgba(255,255,255,0.09)',
dash: claro ? 'rgba(29,26,38,0.3)' : 'rgba(255,255,255,0.3)',
gop: claro ? '0.9' : '0.6'
};
}
}
</script>
</body>
</html>
