<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Elegir destino</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Chakra+Petch:wght@500;700&display=swap">
<style>
body{margin:0}
a{text-decoration:none}a:hover{opacity:0.9}
@keyframes respira{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 40px 20px 28px; background: {{bg}}; color: {{fg}}; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
<div aria-hidden="true" style="position: absolute; left: 230px; top: -150px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, #B79CFF 0%, transparent 66%); filter: blur(36px); opacity: {{gop}}; animation: respira 7s ease-in-out infinite"></div>
<div aria-hidden="true" style="position: absolute; left: -160px; top: 620px; width: 360px; height: 360px; border-radius: 50%; background: radial-gradient(circle, #FF5C39 0%, transparent 66%); filter: blur(36px); opacity: {{gop}}; animation: respira 9s ease-in-out infinite"></div>
<div style="position: relative; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: {{muted}}">Casa Central</span>
<h1 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 38px; line-height: 1.1">¿A dónde vas?</h1>
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 8px">
<label for="destino" style="font-size: 14px; color: {{muted}}">Edificio o sala</label>
<div style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; border-radius: 18px; background: {{surface}}; backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); border: 1px solid {{line}}; box-sizing: border-box; color: {{muted}}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input id="destino" type="text" placeholder="Busca por nombre" style="flex-grow: 1; min-width: 0; height: 44px; background: transparent; border: 0; outline: 0; color: {{fg}}; font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 16px">
</div>
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 10px; flex-grow: 1">
<span style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: {{muted}}">Edificios</span>
<sc-for list="{{edificios}}" as="e" hint-placeholder-count="5">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 12px 14px; border-radius: 20px; background: {{surface}}; backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); border: 1px solid {{line}}; box-sizing: border-box; color: {{fg}}">
<span style="width: 48px; height: 48px; border-radius: 14px; background: {{badgeBg}}; display: flex; align-items: center; justify-content: center; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 20px; color: {{badge}}; flex-shrink: 0">{{e.letra}}</span>
<span style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
<span style="font-size: 16px; font-weight: 600">{{e.nombre}}</span>
<span style="font-size: 13px; font-weight: 600; color: {{e.tono}}">{{e.fotos}}</span>
</span>
<span style="font-family: 'Chakra Petch', sans-serif; font-weight: 500; font-size: 16px; color: {{muted}}">{{e.dist}}</span>
</a>
</sc-for>
</div>
<div style="position: relative; font-size: 14px; line-height: 1.4; color: {{muted}}">Tú eliges el camino. Nosotros te decimos hacia dónde.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","default":"oscuro","options":["oscuro","claro"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var claro = (this.props.tema ?? 'oscuro') === 'claro';
return {
bg: claro ? '#F6F1EA' : '#15131F',
fg: claro ? '#1D1A26' : '#F5F1EA',
muted: claro ? '#5E5869' : '#B3ADBF',
surface: claro ? 'rgba(255,255,255,0.68)' : 'rgba(40,36,56,0.62)',
line: claro ? 'rgba(29,26,38,0.07)' : 'rgba(255,255,255,0.09)',
badge: claro ? '#5B45C9' : '#C9B8FF',
badgeBg: claro ? 'rgba(91,69,201,0.1)' : 'rgba(201,184,255,0.12)',
gop: claro ? '0.7' : '0.5',
edificios: [
{ letra: 'C', nombre: 'Edificio C', fotos: '4 fotos de la comunidad', dist: '180 m' },
{ letra: 'A', nombre: 'Edificio A', fotos: '2 fotos de la comunidad', dist: '90 m' },
{ letra: 'F', nombre: 'Edificio F', fotos: 'Aún sin fotos', dist: '140 m' },
{ letra: 'M', nombre: 'Edificio M', fotos: '1 foto de la comunidad', dist: '320 m' },
{ letra: 'P', nombre: 'Edificio P', fotos: 'Aún sin fotos', dist: '410 m' }
].map(function (e) {
var con = e.fotos.indexOf('Aún') !== 0;
return { letra: e.letra, nombre: e.nombre, fotos: e.fotos, dist: e.dist, tono: con ? (claro ? '#B8330F' : '#FF8A6B') : (claro ? '#5E5869' : '#B3ADBF') };
})
};
}
}
</script>
</body>
</html>
